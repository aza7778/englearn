<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EngLearn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: desktop = fixed sidebar + sticky top bar + dashboard grid; phone = single column + 6-tab bottom bar. Dark-first violet palette. */
:root{
  --bg:#090618; --surface:#120E2B; --surface2:#1B1542; --ink:#F4F1FF; --muted:#A59DCE; --line:#2B2460;
  --accent:#6A45F2; --accent2:#3B6FF0; --acc-ink:#B9A8FF; --mark:#F5B83D; --ok:#4CC68C; --bad:#F0756E;
  --glow:rgba(106,69,242,.38);
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif; --f-display:'Plus Jakarta Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F1FF; --surface:#FFFFFF; --surface2:#EAE6FF; --ink:#1B1545; --muted:#5B5490; --line:#D9D3F7;
  --accent:#5B3AE8; --accent2:#3A6AEE; --acc-ink:#5B3AE8; --ok:#1B8654; --bad:#BE3C36; --glow:rgba(91,58,232,.2); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F1FF; --surface:#FFFFFF; --surface2:#EAE6FF; --ink:#1B1545; --muted:#5B5490; --line:#D9D3F7;
  --accent:#5B3AE8; --accent2:#3A6AEE; --acc-ink:#5B3AE8; --ok:#1B8654; --bad:#BE3C36; --glow:rgba(91,58,232,.2); color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}
svg{display:block}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2))}

.side{display:none}
.col{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;height:68px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1160px;margin-inline:auto}
#topLv{flex:1;min-width:0}
.tl{font:800 22px var(--f-display);letter-spacing:-.02em}
.theme{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--acc-ink)}
.theme svg{width:22px;height:22px}
.page{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
.narrow{max-width:780px}

.levels{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;min-width:54px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-mono);color:var(--muted)}
.lv[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 18px var(--glow)}
.vtabs .lv{font:600 14px var(--f-body)}
.band{display:flex;gap:10px;align-items:baseline;margin:0 2px 4px;font:500 13px var(--f-mono);color:var(--muted)}
.band em{font-style:normal;font:600 14px var(--f-body);color:var(--ink)}
h1{font:800 32px/1.1 var(--f-display);letter-spacing:-.025em;margin:16px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
h2{font:700 18px/1.25 var(--f-display);margin:0 0 8px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.tag{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tag.mark{background:var(--mark);color:#1A1405;padding:2px 7px;border-radius:5px}
.prompt{font-size:17px;white-space:pre-wrap;margin:4px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:0;font-weight:500}

.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 22px var(--glow)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>.grow{flex:1 1 140px;min-width:0}

textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:12px 14px;min-height:48px}
textarea{min-height:190px;resize:vertical;line-height:1.55}
.count{font:500 13px var(--f-mono);color:var(--muted)}
.count.ok{color:var(--ok)}
.err{color:var(--bad);margin:0}
.err:empty{display:none}
.busy{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}

.bandbox{display:flex;align-items:center;gap:16px}
.bn{font:800 56px/1 var(--f-display);letter-spacing:-.03em;box-shadow:inset 0 -14px 0 var(--mark)}
.crit{display:grid;gap:10px;margin-top:14px}
.crit div{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.crit span:last-child{font-family:var(--f-mono)}
.bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mis{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.mis:first-child{border:0;padding:0;margin:0}
.wr{color:var(--bad);text-decoration:line-through}
.fx{color:var(--ok);font-weight:700}
.why{color:var(--muted);font-size:14px;margin:4px 0 0}
ul.plain{margin:0;padding-left:20px}
.improved{white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:12px;margin:6px 0 0}

.q{padding-block:6px}
.qt{font-weight:700;margin:0 0 8px;display:flex;gap:10px}
.qn{font:500 13px var(--f-mono);background:var(--surface2);border-radius:7px;min-width:26px;height:26px;display:grid;place-items:center;flex:none;margin-top:1px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:48px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.opt .ol{font:500 13px var(--f-mono);color:var(--muted);flex:none}
.opt.sel{border-color:var(--acc-ink);box-shadow:inset 0 0 0 1px var(--acc-ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg));box-shadow:none}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg));box-shadow:none}
.opt:disabled{opacity:1;color:var(--ink)}
.passage{white-space:pre-wrap;font-size:17px;line-height:1.7;margin:6px 0 0;max-width:65ch}
.score{font:800 28px var(--f-display)}
.play{width:64px;height:64px;border-radius:50%;flex:none;padding:0}
.play svg{width:26px;height:26px}

.chat{display:flex;flex-direction:column;gap:8px;min-height:140px;max-height:380px;overflow-y:auto;padding:2px}
.msg{padding:10px 14px;border-radius:16px;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{background:var(--surface2);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.chatrow{display:flex;gap:10px;margin-top:12px}
.chatrow input{flex:1;min-width:0}

.vstat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vstat .card{padding:12px}
.vstat b{display:block;font:800 26px var(--f-display)}
.vtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.vtabs::-webkit-scrollbar{display:none}
.vbody{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.fcard{text-align:center;padding:32px 18px;cursor:pointer}
.big{font:800 clamp(28px,7vw,46px)/1.1 var(--f-display);overflow-wrap:anywhere}
.fcard img{max-width:100%;max-height:160px;border-radius:14px;margin-bottom:10px}
.ans{font:700 26px var(--f-display);color:var(--ok);margin:8px 0 14px}
.res{margin:10px 0 0;font-weight:700}
.vwg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vw{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px 12px;text-align:center;min-height:112px;min-width:0}
.vw img{width:100%;height:80px;object-fit:cover;border-radius:10px;margin-bottom:6px}
.vw b{display:block;font-size:18px;overflow-wrap:anywhere}
.vw small{color:var(--ok);font-weight:600;overflow-wrap:anywhere}
.vw .ph{display:block;color:var(--muted);font-size:12px}
.vw .x,.vw .sp{position:absolute;top:2px;background:none;border:0;color:var(--muted);width:40px;height:40px;font-size:15px}
.vw .x{right:0}.vw .sp{left:0}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.fields{display:grid;gap:12px}
input[type=file]{width:100%;font-size:14px}

/* home */
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:#150B3E;color:#F4F1FF;min-height:330px;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
.hero-art{position:absolute;inset:0;z-index:0}
.hero-art svg{width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#150B3E 8%,rgba(21,11,62,.82) 45%,rgba(21,11,62,.25) 100%)}
.hero>*:not(.hero-art){position:relative;z-index:2}
.hello{align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(32px,7.4vw,56px);margin:0 0 12px;line-height:1.08;letter-spacing:-.03em}
.hero h1 span{background:linear-gradient(90deg,#F0ABFC,#C084FC 60%,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 20px;max-width:44ch;color:#DDD6FE}
.hero .btn.ghost{color:#F4F1FF;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.06)}
.sks{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.sk{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--ink)}
.sk .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--acc-ink)}
.sk .ic svg{width:26px;height:26px}
.sk .tx{flex:1;min-width:0}
.sk b{display:block;font:700 18px var(--f-display)}
.sk span.d{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.sk .n{display:block;margin-top:6px;font:500 12px var(--f-mono);color:var(--acc-ink)}
.go{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff}
.go svg{width:18px;height:18px}
.dash{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 28px var(--f-display)}
.pg{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.kv{display:grid;gap:14px;flex:1;min-width:150px}
.kv small{display:block;color:var(--muted);font-size:13px}
.kv strong{font:700 22px var(--f-display)}
.goalrow{display:flex;gap:12px;align-items:center;margin:6px 0 12px}
.goalrow .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--acc-ink);flex:none}
.goalrow .ic svg{width:26px;height:26px}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mline{display:flex;gap:12px;align-items:center;margin:0 0 10px;font:500 13px var(--f-mono);color:var(--muted)}
.qa{list-style:none;margin:0;padding:0}
.qa li+li{border-top:1px solid var(--line)}
.qa button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;min-height:56px;text-align:left;font-weight:600}
.qa .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.qa .ic svg{width:20px;height:20px}
.qa .go{margin-left:auto;width:32px;height:32px;border-radius:50%}
.qa .go svg{width:14px;height:14px}

.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 22px}
.brand svg{width:44px;height:44px;color:#A78BFA}
.brand b{display:block;font:800 20px/1.1 var(--f-display)}
.brand span{font-size:12px;color:var(--muted)}
.navi{display:flex;align-items:center;gap:14px;height:50px;padding:0 16px;border-radius:14px;border:0;background:transparent;color:var(--muted);font-weight:600;width:100%;text-align:left}
.navi svg{width:22px;height:22px;flex:none}
.navi[aria-current="page"]{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 22px var(--glow)}
#sideNav{display:flex;flex-direction:column;gap:6px}
.lvcard{margin-top:auto;border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(160deg,var(--surface2),var(--surface))}
.lvcard b{display:block;font:800 30px var(--f-display);color:var(--acc-ink)}
.lvcard span{display:block;font-size:13px;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--acc-ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(92vw,420px);text-align:center}

@media (min-width:1100px){
  .sks{grid-template-columns:repeat(5,1fr)}
  .sk{flex-direction:column;align-items:flex-start;min-height:190px;position:relative}
  .sk .go{position:absolute;right:14px;bottom:14px}
  .dash{grid-template-columns:1.25fr 1.1fr 1fr}
}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:272px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding:22px 18px 22px max(18px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--bg)}
  .tabs{display:none}
  .tl{display:none}
  .page{padding-bottom:48px}
  #toast{bottom:28px}
  .hero{min-height:360px;padding:40px 44px}
  h1{font-size:38px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M5 14l8 9 11-15 11 15 8-9-4 22H9z"/><circle cx="5" cy="13" r="2.6"/><circle cx="24" cy="7" r="2.6"/><circle cx="43" cy="13" r="2.6"/></svg><div><b>EngLearn</b><span>Learn · Practice · Speak</span></div></div>
    <nav id="sideNav" aria-label="Bo‘limlar"></nav>
    <div class="lvcard" id="lvCard"></div>
  </aside>
  <div class="col">
    <div class="topbar"><div class="topin"><div id="topLv"></div><button class="theme" id="themeBtn" data-act="theme" aria-label="Qora yoki oq rejimni almashtirish"></button></div></div>
    <main class="page" id="app"></main>
  </div>
</div>
<nav class="tabs" id="tabs" aria-label="Bo‘limlar"></nav>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function lsGet(k,d){try{var v=localStorage.getItem(k);if(v==null)return d;var j=JSON.parse(v);return j==null?d:j}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function h(t,p){var e=document.createElement(t);p=p||{};for(var k in p){if(k.indexOf('aria-')===0)e.setAttribute(k,p[k]);else e[k]=p[k]}for(var i=2;i<arguments.length;i++)e.append(arguments[i]);return e}
function wc(t){var m=String(t||'').trim().match(/[A-Za-z0-9’'-]+/g);return m?m.length:0}

var LV=['A1','A2','B1','B2','C1','C2'];
var BAND={A1:'1–2',A2:'3–3.5',B1:'4–5',B2:'5.5–6.5',C1:'7–8',C2:'8.5–9'};
var NAME={A1:'Boshlang‘ich',A2:'Elementar',B1:'O‘rta',B2:'O‘rta-yuqori',C1:'Ilg‘or',C2:'Mukammal'};
var RATE={A1:.75,A2:.85,B1:.92,B2:1,C1:1,C2:1.05};
var TOPICS=['travel','health','technology','food','work','education','sport','the city','nature','shopping','music','friends','money','transport','the internet','weather','holidays','housing','books','volunteering'];

var ICON={
  home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  speaking:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  writing:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
  reading:'<path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/>',
  listening:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  vocab:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h8M8 14h5"/>'

function toDataURL(b){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(b)})}
function apiSample(){
  var f=function(inp,o){
    o=o||{};
    var m=typeof inp==='string'?[{role:'user',content:inp}]:inp;
    return Promise.all((o.images||[]).map(toDataURL)).then(function(im){
      return fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:m,images:im}),signal:o.signal});
    }).then(function(r){
      return r.json().catch(function(){return {}}).then(function(d){
        if(!r.ok)throw {code:'api',message:d.error||('Server xatosi ('+r.status+')')};
        return {text:d.text||''};
      });
    },function(e){
      if(e&&e.name==='AbortError')throw {code:'cancelled'};
      throw {code:'network',message:'Internetga ulanib bo‘lmadi.'};
    });
  };
  f.json=function(inp,o){return f(inp,o).then(function(r){
    var t=r.text.replace(/```json|```/g,'').trim(),a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
    if(a<0||b<a)throw {code:'invalid_json'};
    try{return JSON.parse(t.slice(a,b+1))}catch(e){throw {code:'invalid_json'}}
  })};
  return f;
}
var _s=null;
function getSample(){

}

function errMsg(e){

  var m={not_granted:'AI ishlatishga ruxsat berilmadi. Sahifani qayta ochib, ruxsat bering.',sampling_disabled:'Bu akkauntda AI mavjud emas.',rate_limited:'So‘rovlar ko‘payib ketdi. Birozdan keyin urinib ko‘ring.',invalid_json:'AI javobi noto‘g‘ri formatda keldi. Yana bir marta urinib ko‘ring.',session_expired:'Sessiya tugagan. Qaytadan kiring.',images_unavailable:'Bu yerda rasmdan o‘qish ishlamaydi.',cancelled:''};

}

var playing=false;
function stopSpeak(){playing=false;try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}setPlayUI(false)}
function setPlayUI(on){var b=$('#playBtn');if(!b)return;b.innerHTML=on?svg('<rect x="6" y="6" width="12" height="12" rx="2"/>'):svg('<path d="M8 5l11 7-11 7z"/>');b.setAttribute('aria-label',on?'To‘xtatish':'Tinglash')}
function speak(text,rate,onEnd){
  if(!('speechSynthesis' in window)){toast('Bu brauzer ovoz chiqarmaydi.');return false}
  try{
    speechSynthesis.cancel();
    var voices=(speechSynthesis.getVoices()||[]).filter(function(v){return /^en/i.test(v.lang)});
    var names=[],items=[];
    String(text).split(/\n+/).map(function(l){return l.trim()}).filter(Boolean).forEach(function(l){
      var m=l.match(/^([A-Za-z][A-Za-z ]{0,18}):\s*(.+)$/),who=m?m[1]:'',body=m?m[2]:l,idx=0;
      if(who){idx=names.indexOf(who);if(idx<0){names.push(who);idx=names.length-1}}
      (body.match(/[^.!?]+[.!?]*/g)||[body]).forEach(function(p){p=p.trim();if(p)items.push({t:p,i:idx})});
    });
    items.forEach(function(it,n){
      var u=new SpeechSynthesisUtterance(it.t);u.lang='en-US';u.rate=rate||1;
      if(voices.length)u.voice=voices[it.i%2===1&&voices.length>1?1:0];
      if(it.i%2===1)u.pitch=.8;
      if(n===items.length-1)u.onend=function(){if(onEnd)onEnd()};
      u.onerror=function(){if(onEnd)onEnd()};
      speechSynthesis.speak(u);
    });
    return items.length>0;
  }catch(e){toast('Ovozni yoqib bo‘lmadi.');return false}
}
var SRC=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;

function setMic(on){var b=$('#micBtn');if(b)b.textContent=on?'Tinglanmoqda… (to‘xtatish)':'Gapirish'}
function listen(){

    rec.onresult=function(ev){var t=ev.results[0][0].transcript;rec=null;setMic(false);if(t)chatTurn(t)};
    rec.onerror=function(ev){rec=null;setMic(false);toast((ev.error==='not-allowed'||ev.error==='service-not-allowed')?'Mikrofonga ruxsat berilmagan. Klaviaturadagi mikrofon tugmasidan foydalaning.':'Ovoz eshitilmadi. Yana urinib ko‘ring.')};
    rec.onend=function(){rec=null;setMic(false)};
    rec.start();setMic(true);
  }catch(e){rec=null;setMic(false);toast('Mikrofonni yoqib bo‘lmadi.')}
}

function normEval(r){
  if(!r||typeof r!=='object')throw {code:'invalid_json'};
  var band=Number(r.band);if(!isFinite(band))throw {code:'invalid_json'};
  var crit=(Array.isArray(r.criteria)?r.criteria:[]).map(function(c){return {name:String(c&&c.name||''),score:Number(c&&c.score)||0}}).filter(function(c){return c.name});
  return {band:Math.max(0,Math.min(9,band)),criteria:crit,
    strengths:(Array.isArray(r.strengths)?r.strengths:[]).map(String),
    mistakes:(Array.isArray(r.mistakes)?r.mistakes:[]).filter(function(m){return m&&m.wrong}).map(function(m){return {wrong:String(m.wrong),fix:String(m.fix||''),why:String(m.why||'')}}),
    improved:r.improved?String(r.improved):'',tip:r.tip?String(r.tip):''};
}

function chatTurn(text){
  var st=S.speaking;if(st.busy)return;

  st.busy=true;st.err='';st.ctl=new AbortController();paintChat();

  getSample().then(function(s){return s(p,{signal:ctl.signal,modelTier:'quick',cache:false})}).then(function(r){

    c.append(h('button',{className:'sp',textContent:'♪',title:'Eshitish','aria-label':'Eshitish',onclick:function(){speak(x.w,.9)}}),h('button',{className:'x',textContent:'✕',title:'O‘chirish','aria-label':'O‘chirish',onclick:function(){W=W.filter(function(y){return y!==x});vsave();rv()}}));
    g.append(c);
  });
  b.append(g);
}

function vHome(){
  var tot=W.length,kn=W.filter(function(x){return x.k}).length,pct=tot?Math.round(kn/tot*100):0,d=day(),circ=2*Math.PI*44;
  var done=ST.n.writing+ST.n.speaking+ST.n.reading+ST.n.listening,wg=Math.min(15,d.w),lg=Math.min(1,d.l);
  var cards=[['vocab','Vocabulary','Yangi so‘zlarni o‘rganing va yodlang.',tot+' ta so‘z · '+kn+' ta ma‘lum'],
    ['listening','Listening','Inglizcha nutqni tinglang va tushuning.',ST.n.listening+' ta mashq bajarildi'],
    ['writing','Writing','Yozing, AI IELTS bo‘yicha baholaydi.',ST.n.writing+' ta mashq bajarildi'],
    ['reading','Reading','Matn o‘qing, savollarga javob bering.',ST.n.reading+' ta mashq bajarildi'],
    ['speaking','Speaking','AI bilan gaplashib mashq qiling.',ST.n.speaking+' ta mashq bajarildi']];
  var sk=cards.map(function(c){return '<button class="sk" data-act="go" data-v="'+c[0]+'"><span class="ic">'+svg(ICON[c[0]])+'</span><span class="tx"><b>'+c[1]+'</b><span class="d">'+c[2]+'</span><span class="n">'+esc(c[3])+'</span></span><span class="go grad">'+ARROW+'</span></button>'}).join('');
  var qa=[['Lug‘at testi','vocab','test','#14B8A6'],['Listening mashqi','listening','','#F59E0B'],['Speaking mashqi','speaking','','#7C5CFF']].map(function(q){return '<li><button data-act="go" data-v="'+q[1]+'"'+(q[2]?' data-m="'+q[2]+'"':'')+'><span class="ic" style="background:'+q[3]+'">'+svg(ICON[q[1]])+'</span><span>'+q[0]+'</span><span class="go grad">'+ARROW+'</span></button></li>'}).join('');
  return '<section class="hero"><div class="hero-art">'+HERO_ART+'</div><span class="hello">Xush kelibsiz!</span><h1>Master English<br><span>One Step at a Time</span></h1><p>Yangi so‘zlar o‘rganing, amaliy mashq qiling va gapirish, yozish, o‘qish hamda tinglashda ishonch qozoning.</p><div class="row"><button class="btn" data-act="go" data-v="vocab" data-m="cards">O‘rganishni boshlash '+ARROW+'</button><button class="btn ghost" data-act="go" data-v="speaking">Gaplashib ko‘rish</button></div></section>'
   +'<div class="sks">'+sk+'</div>'

   +'<button class="btn full" data-act="go" data-v="vocab" data-m="cards">Davom etish '+ARROW+'</button></div>'

/* ---------- render + events ---------- */
var VIEWS={home:vHome,vocab:vVocab,speaking:vSpeaking,writing:vWriting,reading:vReading,listening:vListening};
function render(){
  var skill=tab!=='home'&&tab!=='vocab';
  $('#topLv').innerHTML=skill?levelChips():'<div class="tl">EngLearn</div>';
  var body=VIEWS[tab]();
  $('#app').innerHTML=tab==='home'?body:'<div class="narrow">'+(skill?'<div class="band"><span>IELTS ≈ '+BAND[level]+'</span><em>'+NAME[level]+'</em></div>':'')+body+'</div>';
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" data-act="tab" data-v="'+t[0]+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+svg(ICON[t[0]])+'<span>'+t[2]+'</span></button>'}).join('');
  $('#sideNav').innerHTML=TABS.map(function(t){return '<button class="navi" data-act="tab" data-v="'+t[0]+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+svg(ICON[t[0]])+'<span>'+t[1]+'</span></button>'}).join('');
  $('#lvCard').innerHTML='<span>Tanlangan daraja</span><b>'+level+'</b><span>IELTS ≈ '+BAND[level]+' · '+NAME[level]+'</span>';
  themeIcon();
  if(tab==='vocab'){$('#vdir').onclick=function(){DIR=DIR==='en'?'uz':'en';lsSet('el_dir',DIR);rv()};rv()}
  if(tab==='speaking'){var c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
}
function setTab(t){tab=t;lsSet('el_tab',t);stopSpeak();stopRec();render();window.scrollTo(0,0)}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v,sec=el.dataset.sec;
  if(a==='theme'){var nx=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',nx);lsSet('el_theme',nx);themeIcon();return}
  if(a==='tab')return setTab(v);
  if(a==='go'){if(el.dataset.m&&v==='vocab'){VT=el.dataset.m;lsSet('el_vt',VT)}setTab(v);return}
  if(a==='level'){level=v;lsSet('el_level',v);freshTasks();render();return}
  if(a==='stop'){[S[tab],tab==='speaking'?S.speakEval:null].forEach(function(st){if(st&&st.ctl)st.ctl.abort()});return}
  if(a==='newTask')return newTask();
  if(a==='check')return checkWriting();
  if(a==='newQuiz')return newQuiz(sec);
  if(a==='opt'){var q=S[sec].quiz;if(!q.checked){q.sel[+el.dataset.q]=+el.dataset.o;render()}return}
  if(a==='quizCheck'){S[sec].quiz.checked=true;bump(sec);render();return}
  if(a==='script'){S.listening.show=!S.listening.show;render();return}
  if(a==='play'){
    if(playing){stopSpeak();return}
    playing=speak(S.listening.quiz.data.script,RATE[level],function(){playing=false;setPlayUI(false)});
    setPlayUI(playing);return;
  }
  if(a==='speakModel'){if(S.speakEval.res&&S.speakEval.res.improved)speak(S.speakEval.res.improved,RATE[level]);return}
  if(a==='send')return sendMsg();
  if(a==='mic')return listen();
  if(a==='newChat'){var st=S.speaking;if(st.ctl)st.ctl.abort();stopRec();st.msgs=[];st.err='';st.busy=false;S.speakEval.res=null;S.speakEval.err='';render();chatTurn('');return}
  if(a==='evalChat')return evalChat();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='ans'){S.writing.text=t.value;var n=wc(t.value),c=$('#wc');c.textContent=n+' / '+S.writing.task.min+' so‘z';c.className='count'+(n>=S.writing.task.min?' ok':'')}
  else if(t.id==='sin'){S.speaking.draft=t.value}
});
document.addEventListener('keydown',function(e){if(e.target.id==='sin'&&e.key==='Enter'){e.preventDefault();sendMsg()}});

freshTasks();render();
})();
</script>
